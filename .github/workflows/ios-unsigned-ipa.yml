# Builds an unsigned .ipa of the iOS app on a GitHub macOS runner.
# No certificates or provisioning profiles: the .ipa is signed on-device
# (FlareStore or similar) when it is installed.
name: iOS unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Dark mode for websites. Pinned version, checked against npm's own
      # integrity hash, so the build only ever bundles this exact file.
      - name: Fetch Dark Reader (MIT)
        env:
          DARKREADER_VERSION: "4.9.135"
          DARKREADER_SHA512: "h/gmS/KzY8HgmsgOSFh7ssJnsC5ymuhIwZqxksPKCS1K400OUJyjDPZN1L2YIrzX+oezhVUNnCDZPfmPUvdJNA=="
        run: |
          set -euo pipefail
          TGZ="$RUNNER_TEMP/darkreader.tgz"
          curl -fsSL -o "$TGZ" "https://registry.npmjs.org/darkreader/-/darkreader-$DARKREADER_VERSION.tgz"
          ACTUAL=$(openssl dgst -sha512 -binary "$TGZ" | base64 | tr -d '\n')
          if [ "$ACTUAL" != "$DARKREADER_SHA512" ]; then
            echo "Dark Reader download does not match its pinned hash"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/darkreader"
          tar -xzf "$TGZ" -C "$RUNNER_TEMP/darkreader"
          mkdir -p ZenCompanion/Vendor
          cp "$RUNNER_TEMP/darkreader/package/darkreader.js" ZenCompanion/Vendor/darkreader.js
          cp "$RUNNER_TEMP/darkreader/package/LICENSE" ZenCompanion/Vendor/darkreader-LICENSE.txt || true
          ls -lh ZenCompanion/Vendor

      - name: Build the ad-block engine (Brave's adblock-rust, MPL-2.0)
        working-directory: rust/zb-adblock
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios
          rustup default stable
          cargo build --release --target aarch64-apple-ios
          mkdir -p ../../ios/ZenCompanion/Vendor/adblock
          cp target/aarch64-apple-ios/release/libzb_adblock.a ../../ios/ZenCompanion/Vendor/adblock/
          ls -lh ../../ios/ZenCompanion/Vendor/adblock

      - name: Build uBlock Origin scriptlets (GPLv3)
        # From a pinned uBO release. A failure leaves scriptlets out of this
        # build (with a warning) instead of failing it.
        env:
          UBO_VERSION: "1.77.4"
        run: |
          set -u
          if git clone --quiet --depth 1 --branch "$UBO_VERSION" https://github.com/gorhill/uBlock.git "$RUNNER_TEMP/uBlock" && node ../scripts/build-scriptlets.mjs "$RUNNER_TEMP/uBlock" ZenCompanion/Vendor/scriptlets.json; then
            ls -lh ZenCompanion/Vendor/scriptlets.json
          else
            echo "::warning::Could not build uBO scriptlets; building without them"
            rm -f ZenCompanion/Vendor/scriptlets.json
          fi

      - name: Fetch filter lists (uBlock Origin, Peter Lowe, HaGeZi)
        # Bundled so a fresh install blocks with them at once; the app
        # downloads newer copies weekly. A failed download leaves the list
        # out of this build instead of failing it.
        run: |
          set -u
          mkdir -p ZenCompanion/Vendor/filters
          for pair in ublock-filters:filters ublock-badware:badware ublock-quick-fixes:quick-fixes ublock-privacy:privacy ublock-unbreak:unbreak; do
            name="${pair%%:*}"; file="${pair##*:}"
            out="ZenCompanion/Vendor/filters/$name.txt"
            if curl -fsSL --max-time 60 -o "$out" "https://ublockorigin.github.io/uAssets/filters/$file.txt"                && head -c 8 "$out" | grep -q "! Title"; then
              echo "$name: $(wc -l < "$out") lines"
            else
              echo "::warning::Could not fetch $name; building without it"
              rm -f "$out"
            fi
          done
          fetch_domains() {
            out="ZenCompanion/Vendor/filters/$1.txt"
            if curl -fsSL --max-time 90 -o "$out" "$2" && head -c 40 "$out" | grep -q "Adblock"; then
              echo "$1: $(wc -l < "$out") lines"
            else
              echo "::warning::Could not fetch $1; building without it"
              rm -f "$out"
            fi
          }
          fetch_domains peter-lowe "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=adblockplus&showintro=0&mimetype=plaintext"
          fetch_domains hagezi-light "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/light.txt"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, Release, device)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ZenCompanion.xcodeproj \
            -scheme ZenCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" "$RUNNER_TEMP/xcodebuild.log"

      - name: Package .ipa
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ZenCompanion.app"
          test -d "$APP" || { echo "App bundle not found at $APP"; exit 1; }
          echo "Bundle contents:"; ls "$APP" | head -50
          PKG="$RUNNER_TEMP/pkg"
          mkdir -p "$PKG/Payload"
          cp -R "$APP" "$PKG/Payload/"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "IPA_NAME=ZenCompanion-unsigned-$SHORT_SHA.ipa" >> "$GITHUB_ENV"
          (cd "$PKG" && zip -qry "$GITHUB_WORKSPACE/ZenCompanion-unsigned-$SHORT_SHA.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE"/*.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
