# Builds an unsigned .ipa of the iOS app on a GitHub macOS runner.
# No certificates or provisioning profiles: the .ipa is signed on-device
# (FlareStore or similar) when it is installed.
name: iOS unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Dark mode for websites. Pinned version, checked against npm's own
      # integrity hash, so the build only ever bundles this exact file.
      - name: Fetch Dark Reader (MIT)
        env:
          DARKREADER_VERSION: "4.9.135"
          DARKREADER_SHA512: "h/gmS/KzY8HgmsgOSFh7ssJnsC5ymuhIwZqxksPKCS1K400OUJyjDPZN1L2YIrzX+oezhVUNnCDZPfmPUvdJNA=="
        run: |
          set -euo pipefail
          TGZ="$RUNNER_TEMP/darkreader.tgz"
          curl -fsSL -o "$TGZ" "https://registry.npmjs.org/darkreader/-/darkreader-$DARKREADER_VERSION.tgz"
          ACTUAL=$(openssl dgst -sha512 -binary "$TGZ" | base64 | tr -d '\n')
          if [ "$ACTUAL" != "$DARKREADER_SHA512" ]; then
            echo "Dark Reader download does not match its pinned hash"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/darkreader"
          tar -xzf "$TGZ" -C "$RUNNER_TEMP/darkreader"
          mkdir -p ZenCompanion/Vendor
          cp "$RUNNER_TEMP/darkreader/package/darkreader.js" ZenCompanion/Vendor/darkreader.js
          cp "$RUNNER_TEMP/darkreader/package/LICENSE" ZenCompanion/Vendor/darkreader-LICENSE.txt || true
          ls -lh ZenCompanion/Vendor

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, Release, device)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ZenCompanion.xcodeproj \
            -scheme ZenCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" "$RUNNER_TEMP/xcodebuild.log"

      - name: Package .ipa
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ZenCompanion.app"
          test -d "$APP" || { echo "App bundle not found at $APP"; exit 1; }
          echo "Bundle contents:"; ls "$APP" | head -50
          PKG="$RUNNER_TEMP/pkg"
          mkdir -p "$PKG/Payload"
          cp -R "$APP" "$PKG/Payload/"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "IPA_NAME=ZenCompanion-unsigned-$SHORT_SHA.ipa" >> "$GITHUB_ENV"
          (cd "$PKG" && zip -qry "$GITHUB_WORKSPACE/ZenCompanion-unsigned-$SHORT_SHA.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE"/*.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
