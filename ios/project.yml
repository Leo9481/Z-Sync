name: ZenCompanion
options:
  # Fork's own IDs so it installs next to the App Store Z-Sync.
  bundleIdPrefix: io.github.leo9481
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  ZenCompanion:
    type: application
    platform: iOS
    sources:
      - path: ZenCompanion
        excludes:
          - "PrivacyInfo.xcprivacy"
          - "Vendor/**"
      - path: Shared
      - path: ZenCompanion/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Fetched by CI at a pinned version (see the workflow); not in the repo.
      - path: ZenCompanion/Vendor/darkreader.js
        buildPhase: resources
        optional: true
      # uBlock Origin's filter lists (GPLv3), fetched fresh by CI each build.
      - path: ZenCompanion/Vendor/filters/ublock-filters.txt
        buildPhase: resources
        optional: true
      - path: ZenCompanion/Vendor/filters/ublock-badware.txt
        buildPhase: resources
        optional: true
      - path: ZenCompanion/Vendor/filters/ublock-quick-fixes.txt
        buildPhase: resources
        optional: true
      - path: ZenCompanion/Vendor/filters/ublock-privacy.txt
        buildPhase: resources
        optional: true
      - path: ZenCompanion/Vendor/filters/ublock-unbreak.txt
        buildPhase: resources
        optional: true
      # uBlock Origin's scriptlets as adblock-rust resources, built by CI.
      - path: ZenCompanion/Vendor/scriptlets.json
        buildPhase: resources
        optional: true
      # Domain lists: Peter Lowe's and HaGeZi's Multi LIGHT (GPLv3).
      - path: ZenCompanion/Vendor/filters/peter-lowe.txt
        buildPhase: resources
        optional: true
      - path: ZenCompanion/Vendor/filters/hagezi-light.txt
        buildPhase: resources
        optional: true
      - path: AppIcon.icon
        buildPhase: resources
    info:
      path: ZenCompanion/Info.plist
      properties:
        CFBundleDisplayName: Z-Browser
        CFBundleName: Z-Browser
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The app's own link form, zsync://open?url=<address>, works without
        # the browser entitlement: a Shortcut can open a page here today.
        # http/https are declared for the default-browser entitlement request;
        # iOS ignores them until Apple grants it (see docs/release.md).
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: io.github.leo9481.zenbrowser.zsync
            CFBundleURLSchemes:
              - zsync
          - CFBundleTypeRole: Viewer
            CFBundleURLName: io.github.leo9481.zenbrowser.web
            CFBundleURLSchemes:
              - http
              - https
        UILaunchScreen: {}
        # Without it an iPhone app's own animations stop at 60 frames a second
        # on a 120 Hz display. iOS still lowers the rate when the display does
        # (Low Power Mode, battery heat), so animations follow the screen.
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleDevelopmentRegion: en
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Google result clicks 302 from https://www.google.com/goto to cleartext
          # http hosts. WKWebView drops that hop unless web content is exempt.
          NSAllowsArbitraryLoadsInWebContent: true
        NSLocalNetworkUsageDescription: Z-Browser loads the icon of a synced tab from the tab's own address, which may be a device on your local network.
        # Asked only after a website in the browser wants them and the reader allows it.
        NSCameraUsageDescription: Websites you allow in the browser can use your camera.
        NSMicrophoneUsageDescription: Websites you allow in the browser can use your microphone.
        NSLocationWhenInUseUsageDescription: Websites you allow in the browser can use your location.
        # Only with Settings → Pages & tabs → Lock private tabs on.
        NSFaceIDUsageDescription: Z-Browser uses Face ID to unlock your private tabs.
        # Asked only when a long press on an image saves it to the photo library.
        NSPhotoLibraryAddUsageDescription: Images you save from a website go to your photo library.
        # Downloads land in Documents, which Files shows under On My iPhone.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: ZenCompanion/ZenCompanion.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.leo9481.zenbrowser
        keychain-access-groups:
          - $(AppIdentifierPrefix)io.github.leo9481.zenbrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.leo9481.zenbrowser
        INFOPLIST_FILE: ZenCompanion/Info.plist
        CODE_SIGN_ENTITLEMENTS: ZenCompanion/ZenCompanion.entitlements
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.7"
        CURRENT_PROJECT_VERSION: "7"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Page translation needs iOS 18; the app still starts on iOS 17.
        # zb_adblock: Brave's adblock-rust (rust/zb-adblock), built by CI.
        # zbwg: wireguard-go (go/zbwg), built by CI; Go's runtime needs resolv.
        OTHER_LDFLAGS: "$(inherited) -weak_framework Translation -lzb_adblock -lzbwg -lresolv -framework CoreFoundation -framework Security"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/ZenCompanion/Vendor/adblock $(SRCROOT)/ZenCompanion/Vendor/wireguard"
        SWIFT_OBJC_BRIDGING_HEADER: ZenCompanion/Browser/ContentBlocking/ZBAdblock.h
    dependencies:
      - target: ShareExtension
        embed: true
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - "PrivacyInfo.xcprivacy"
      - path: Shared
      - path: ZenCompanion/Assets.xcassets
        excludes:
          - "AppIcon.appiconset"
      - path: ShareExtension/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Z-Browser
        CFBundleName: Z-Browser
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Z-Browser loads the icon of a synced tab from the tab's own address, which may be a device on your local network.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.leo9481.zenbrowser
        keychain-access-groups:
          - $(AppIdentifierPrefix)io.github.leo9481.zenbrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.leo9481.zenbrowser.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.7"
        CURRENT_PROJECT_VERSION: "7"
        SKIP_INSTALL: true
  ZenCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZenCompanionTests
      - path: Shared
      # Leaf dirs so JSON lands at the test-bundle root (loaders use basename).
      - path: ../shared/contract/fixtures/crypto
        name: ContractFixturesCrypto
        buildPhase: resources
      - path: ../shared/contract/fixtures/wire
        name: ContractFixturesWire
        buildPhase: resources
      - path: ../shared/contract/fixtures/auth
        name: ContractFixturesAuth
        buildPhase: resources
      - path: ../shared/contract/http
        name: ContractHTTP
        buildPhase: resources
    dependencies:
      - target: ZenCompanion
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.leo9481.zenbrowser.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  ZenCompanion:
    build:
      targets:
        ZenCompanion: all
        ZenCompanionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZenCompanionTests
